<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Esto No Es Una Revista</title>
    <style>
        /* Pantalla de espera limpia en negro mientras salta de servidor */
        body { 
            background-color: #000000; 
            margin: 0; 
            padding: 0; 
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Tu usuario de GitHub
            const USUARIO = "Javo-Martinez";

            // Definimos que el número que queremos mostrar en portada es el 1
            const EDICION_VIGENTE = 5; 

            // Formateamos el número a dos dígitos (ej: 1 -> "01")
            const numFormateado = String(EDICION_VIGENTE).padStart(2, '0');

            // Armamos la URL pública nativa de tu nuevo repositorio satélite bloque 01-10
            const urlDestino = `https://${USUARIO}.github.io/eneur-01-10/revista${numFormateado}/index.html`;

            // Ejecutamos la redirección saltando el historial para evitar bucles
            window.location.replace(urlDestino);
        });
    </script>
</head>

</html>
